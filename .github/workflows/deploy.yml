name: Redirect GitHub Pages to brieuc.co

on:
  push:
    branches: [main]
  workflow_dispatch:

# The site itself is hosted on Vercel (brieuc.co); GitHub Pages only serves
# a redirect page so old brieucdegoussencourt.github.io links keep working.

# Least privilege: read-only by default, Pages write only for the deploy job
permissions:
  contents: read

# One deploy at a time; don't cancel an in-progress production deploy
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: github-pages-redirect

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
