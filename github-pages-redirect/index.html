<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>Redirection vers brieuc.co</title>
    <meta name="robots" content="noindex" />
    <link rel="canonical" href="https://brieuc.co/" />
    <meta http-equiv="refresh" content="0; url=https://brieuc.co/" />
    <script>
      // Keep the path, query and hash so deep links land on the same page.
      location.replace("https://brieuc.co" + location.pathname + location.search + location.hash);
    </script>
  </head>
  <body>
    <p>Ce site a déménagé : <a href="https://brieuc.co/">brieuc.co</a></p>
  </body>
</html>
